<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>権限設定｜GHShift</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef3f8;--panel:#fff;--line:#d4dde8;--line2:#b7c3d2;--text:#172033;--sub:#405069;--muted:#6b7b91;--blue:#2f6fd6;--font:'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif;--mono:'DM Mono',monospace}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}
.topbar::-webkit-scrollbar{display:none}.topbar{height:47px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.brand{font-size:20px;font-weight:700;color:var(--text);text-decoration:none;padding-right:10px;border-right:1px solid var(--line)}
.page-title{font-size:20px;font-weight:700;white-space:nowrap}
.common-nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.btn{height:30px;padding:4px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--sub);font:500 12px/1 var(--font);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-shadow:none}
.nav-request{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.nav-adjust{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}.nav-approve{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}.nav-staff{background:#ecfeff;border-color:#a5f3fc;color:#0f766e}.nav-facility{background:#fff7ed;border-color:#fed7aa;color:#c2410c}.nav-settings{background:#2f6fd6;border-color:#245fbe;color:#fff}.nav-logout{background:#fef2f2;border-color:#fecaca;color:#dc2626}
.subbar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px}.sub-title{font-size:14px;font-weight:700}.sub-actions{margin-left:auto;display:flex;gap:8px}.btn-primary{background:#2f6fd6;border-color:#245fbe;color:#fff}.btn-danger{background:#fef2f2;border-color:#fecaca;color:#dc2626}.btn-delete{height:28px;padding:3px 9px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626;font:500 11px/1 var(--font);cursor:pointer;white-space:nowrap}.btn-delete:hover{background:#fee2e2;border-color:#fca5a5}.btn-delete:disabled{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.layout{height:calc(100% - 95px);display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}
.hamburger-btn{display:none;position:fixed;top:58px;left:8px;z-index:500;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.left-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:400}
@media(max-width:600px){
  .layout{display:flex!important;flex-direction:column!important}
  .side{
    display:none!important;
    position:fixed!important;top:95px;left:0;bottom:0;width:260px!important;z-index:450;
    background:#fff;overflow-y:auto;box-shadow:2px 0 8px rgba(0,0,0,.2);
  }
  .side.open{display:flex!important;flex-direction:column}
  .left-overlay.open{display:block}
  .hamburger-btn{display:flex}
  .main{flex:1!important;min-height:0!important;width:100%!important}
  .subbar{padding-left:48px!important}
  .role-table{min-width:0!important}
  .table-wrap{overflow-x:visible!important}
  .role-table thead{display:none}
  .role-table,.role-table tbody,.role-table tr,.role-table td{display:block;width:100%}
  .role-table tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px 10px}
  .role-table td{border:0!important;padding:6px 0!important;display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .role-table td[data-label]:not([data-label=""])::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--sub)}
  .role-table td .input,.role-table td .select,.role-table td .password-wrap{width:100%!important}
}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.side-head{height:44px;padding:0 14px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#f7f9fc;font-weight:700}.role-list{flex:1;overflow:auto;padding:7px}.role-item{padding:9px 11px;border:1px solid transparent;border-radius:7px;margin-bottom:4px;cursor:pointer;display:flex;align-items:center;gap:8px}.role-item:hover{background:#f7f9fc}.role-item.active{background:#edf4ff;border-color:#bfdbfe;color:#1d4ed8}.role-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.role-item.active .role-dot{background:#2f6fd6}
.main{overflow:auto;padding:14px}.info{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--sub);font-size:12px;margin-bottom:10px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:auto}.role-table{width:100%;border-collapse:collapse;min-width:1040px}.role-table th{position:sticky;top:0;background:#f7f9fc;border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;font-size:11px;color:var(--sub);white-space:nowrap}.role-table td{border-bottom:1px solid #edf1f5;padding:8px;vertical-align:middle}.role-table tr.selected td{background:#edf4ff}.role-table tr:last-child td{border-bottom:0}
.input,.select{width:100%;height:32px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--text);padding:5px 8px;font:12px var(--font)}.input:focus,.select:focus{outline:none;border-color:#2f6fd6;box-shadow:0 0 0 2px rgba(47,111,214,.12)}.role-input{min-width:120px}.password-wrap{position:relative;min-width:145px}.password-wrap .input{padding-right:34px}.eye{position:absolute;right:4px;top:3px;width:26px;height:26px;border:0;background:transparent;color:#64748b;cursor:pointer;font-size:14px}.readonly{background:#f8fafc;color:#64748b}.empty{padding:40px;text-align:center;color:var(--muted)}.save-state{font-size:11px;color:var(--muted)}
.toast-wrap{position:fixed;bottom:14px;right:14px;z-index:1000;display:flex;flex-direction:column;gap:5px}
.toast{padding:8px 13px;border-radius:8px;font-size:12px;box-shadow:0 4px 14px rgba(15,23,42,.16);border:1px solid;display:flex;align-items:center;gap:6px;animation:tin .2s ease-out}
.t-ok{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}
.t-warn{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
.t-err{background:#fef2f2;border-color:#fecaca;color:#dc2626}
@keyframes tin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1050px){.common-nav .btn{padding:4px 8px}.brand,.page-title{font-size:17px}.layout{grid-template-columns:230px minmax(0,1fr)}}



/* ===== 共通ヘッダー調整 v3：縦線1本・タイトル枠なし ===== */
.logo,
.brand,
.app-brand{
  border-right:0!important;
  padding-right:0!important;
}
.header-badge-brand{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  min-height:30px!important;
  padding:4px 13px!important;
  border:1px solid #9dbcf8!important;
  border-radius:999px!important;
  background:#eaf2ff!important;
  color:#1d4ed8!important;
  font-size:15px!important;
  font-weight:700!important;
  line-height:1!important;
  text-decoration:none!important;
  white-space:nowrap!important;
  box-shadow:none!important;
}
.header-title-separator{
  width:1px!important;
  height:30px!important;
  background:#b7c3d2!important;
  margin:0 6px!important;
  flex:0 0 auto!important;
}
.header-badge-title{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  min-height:30px!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  color:#172033!important;
  font-size:20px!important;
  font-weight:700!important;
  line-height:1!important;
  white-space:nowrap!important;
  box-shadow:none!important;
}
@media(max-width:900px){
  .header-badge-title{font-size:17px!important;}
}

</style>
</head>
<body>
<div class="toast-wrap" id="toast-wrap"></div>
<header class="topbar">
  <a class="brand header-badge-brand" href="/">GHShift</a>
  <span class="header-title-separator" aria-hidden="true"></span>
  <span class="page-title header-badge-title">権限設定</span>
  <nav class="common-nav">
    <button class="btn nav-request" type="button" onclick="openShift(1)">希望日入力</button>
    <button class="btn nav-adjust" type="button" onclick="openShift(3)">シフト確認・調整</button>
    <button class="btn nav-approve" type="button" onclick="openShift(4)">承認・確定・公開</button>
    <a class="btn nav-staff" href="/staff">職員</a>
    <a class="btn nav-facility" href="/facility">事業所</a>
    <a class="btn nav-settings" href="/permissions">権限設定</a>
    <span id="nav-user-badge" style="display:none;align-items:center;gap:5px;font-size:11px;color:#405069;padding:0 8px;border-left:1px solid #d4dde8">
      <span id="nav-user-icon" style="width:22px;height:22px;border-radius:50%;background:#2f6fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">—</span>
      <span id="nav-user-name" style="font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
    </span>
    <button class="btn nav-logout" type="button" onclick="logoutApp()">ログアウト</button>
  </nav>
</header>
<div class="subbar">
  <span class="sub-title">ロール設定</span>
  <span class="save-state" id="save-state"></span>
  <div class="sub-actions">
    <button class="btn" type="button" onclick="addRole()">新規</button>
    <button class="btn btn-primary" type="button" onclick="saveRoles()">保存</button>
  </div>
</div>
<div class="left-overlay" id="left-overlay" onclick="closeLeftPanel()"></div>
<button class="hamburger-btn" id="hamburger-btn" onclick="toggleLeftPanel()">☰</button>
<div class="layout">
  <aside class="side">
    <div class="side-head">ロール一覧</div>
    <div class="role-list" id="role-list"></div>
  </aside>
  <main class="main">
    <div class="info">ロールごとのパスワードと、各操作の許可／不可を設定します。実際のボタン表示・操作制御および二段階承認への適用は次工程で行います。</div>
    <div class="table-wrap">
      <table class="role-table">
        <thead><tr><th>操作</th><th>ロール</th><th>パスワード</th><th>希望日入力</th><th>自動生成</th><th>シフト確認・調整</th><th>シフト承認</th><th>シフト公開</th><th>職員管理</th><th>事業所管理</th><th>システム設定</th></tr></thead>
        <tbody id="role-body"></tbody>
      </table>
    </div>
  </main>
</div>
<script>
let ROLES=[],selectedIndex=0,DRAFT=null,draftSelected=false,_saving=false;

function toast(msg, type="ok") {
  const w = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = `toast t-${type}`;
  el.innerHTML = `<span>${type==="ok"?"✓":type==="warn"?"⚠":"✕"}</span><span>${msg}</span>`;
  w.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transform="translateX(12px)";el.style.transition="all .3s";setTimeout(()=>el.remove(),300);},3000);
}

function showDirty(){
  if(_saving) return;
  document.getElementById('save-state').textContent='未保存の変更があります';
}
function clearDirty(){
  document.getElementById('save-state').textContent='';
}
const permCols=['perm_req','perm_gen','perm_adjust','perm_approve','perm_publish','perm_staff','perm_facility','perm_settings'];
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));

async function loadRoles(){
  _saving = true;
  try{
    const res=await fetch('/api/permissions');
    if(!res.ok){alert('ロール一覧を取得できません');return;}
    ROLES=await res.json();
    if(!ROLES.length)ROLES=[newRole('admin',true)];
    selectedIndex=Math.min(selectedIndex,Math.max(ROLES.length-1,0));
    DRAFT=null;
    draftSelected=false;
    render();
    clearDirty();
  } finally {
    _saving = false;
  }
}

function newRole(name='',isAdmin=false){
  return {role:name,password:'',has_password:false,perm_req:isAdmin?1:0,perm_gen:isAdmin?1:0,perm_adjust:isAdmin?1:0,perm_approve:isAdmin?1:0,perm_publish:isAdmin?1:0,perm_staff:isAdmin?1:0,perm_facility:isAdmin?1:0,perm_settings:isAdmin?1:0,_new:!isAdmin};
}

function renderRoleList(){
  document.getElementById('role-list').innerHTML=ROLES.map((r,i)=>`<div class="role-item ${!draftSelected&&i===selectedIndex?'active':''}" onclick="selectRole(${i})"><span class="role-dot"></span><span>${esc(r.role)}</span></div>`).join('');
}

function rowHtml(r,key,isDraft=false){
  const isAdmin=r.role==='admin' && !isDraft;
  const k2=isDraft?'draft':key;
  const permLabels={perm_req:'希望日入力',perm_gen:'自動生成',perm_adjust:'シフト確認・調整',perm_approve:'シフト承認',perm_publish:'シフト公開',perm_staff:'職員管理',perm_facility:'事業所管理',perm_settings:'システム設定'};
  return `<tr class="${(isDraft&&draftSelected)||(!isDraft&&!draftSelected&&key===selectedIndex)?'selected':''}" id="role-row-${k2}" onclick="${isDraft?'selectDraft()':`selectRole(${key})`}">
    <td data-label="操作">${isDraft?`<button class="btn-delete" type="button" onclick="event.stopPropagation();cancelDraft()">取消</button>`:`<button class="btn-delete" type="button" ${isAdmin?'disabled title="adminは削除できません"':''} onclick="event.stopPropagation();deleteRole(${key})">削除</button>`}</td>
    <td data-label="ロール"><input class="input role-input ${isAdmin?'readonly':''}" ${isAdmin?'readonly':''} value="${esc(r.role)}" onclick="event.stopPropagation()" oninput="event.stopPropagation();setVal('${k2}','role',this.value)"></td>
    <td data-label="パスワード"><div class="password-wrap"><input class="input" id="pw-${k2}" type="password" value="${esc(r.password||'')}" placeholder="${r.has_password?'変更する場合のみ入力':'パスワードを入力'}" onclick="event.stopPropagation()" oninput="event.stopPropagation();setVal('${k2}','password',this.value)"><button class="eye" type="button" onclick="event.stopPropagation();togglePw('${k2}')">◉</button></div></td>
    ${permCols.map(col=>`<td data-label="${permLabels[col]}"><select class="select" onclick="event.stopPropagation()" onchange="event.stopPropagation();setVal('${k2}','${col}',Number(this.value));showDirty()"><option value="1" ${Number(r[col])===1?'selected':''}>許可</option><option value="0" ${Number(r[col])===0?'selected':''}>不可</option></select></td>`).join('')}
  </tr>`;
}

function render(){
  renderRoleList();
  const rows=ROLES.map((r,i)=>rowHtml(r,i,false));
  if(DRAFT)rows.push(rowHtml(DRAFT,'draft',true));
  document.getElementById('role-body').innerHTML=rows.join('');
}

function selectRole(i){
  selectedIndex=i;
  draftSelected=false;
  render();
  requestAnimationFrame(()=>document.getElementById(`role-row-${i}`)?.scrollIntoView({block:'nearest'}));
}

function selectDraft(){
  if(!DRAFT)return;
  draftSelected=true;
  render();
  requestAnimationFrame(()=>document.getElementById('role-row-draft')?.scrollIntoView({block:'nearest'}));
}

function setVal(key,k,v){
  const target=key==='draft'?DRAFT:ROLES[Number(key)];
  if(!target){ console.warn('[setVal] target not found:', key, k, v); return; }
  target[k]=v;
}

function addRole(){
  if(DRAFT){
    draftSelected=true;
    render();
    setTimeout(()=>document.querySelector('#role-row-draft .role-input')?.focus(),0);
    return;
  }
  DRAFT=newRole();
  draftSelected=true;
  render();
  document.getElementById('save-state').textContent='新規ロールは保存後に左一覧へ追加されます';
  setTimeout(()=>document.querySelector('#role-row-draft .role-input')?.focus(),0);
}

function cancelDraft(){
  DRAFT=null;
  draftSelected=false;
  document.getElementById('save-state').textContent='';
  render();
}

async function deleteRole(index){
  const role=ROLES[index];
  if(!role)return;
  if(role.role==='admin'){alert('adminは削除できません');return;}
  if(!confirm(`ロール「${role.role}」を削除しますか？`))return;
  const res=await fetch(`/api/permissions/${encodeURIComponent(role.role)}`,{method:'DELETE'});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){alert(data.error||'削除に失敗しました');return;}
  toast('削除しました','ok');
  selectedIndex=Math.max(0,index-1);
  await loadRoles();
}

function togglePw(key){
  const el=document.getElementById(`pw-${key}`);
  if(el)el.type=el.type==='password'?'text':'password';
}

async function saveRoles(){
  const all=DRAFT?[...ROLES,DRAFT]:[...ROLES];
  const names=all.map(r=>String(r.role||'').trim());
  if(names.some(n=>!n)){alert('ロール名を入力してください');return;}
  if(new Set(names).size!==names.length){alert('ロール名が重複しています');return;}
  if(DRAFT && !String(DRAFT.password||'').trim()){
    alert('新規ロールのパスワードを入力してください');
    document.getElementById('pw-draft')?.focus();
    return;
  }
  const payload=all.map(r=>({
    role:String(r.role).trim(), password:r.password||'',
    perm_req:Number(r.perm_req||0), perm_gen:Number(r.perm_gen||0),
    perm_adjust:Number(r.perm_adjust||0), perm_approve:Number(r.perm_approve||0),
    perm_publish:Number(r.perm_publish||0), perm_staff:Number(r.perm_staff||0),
    perm_facility:Number(r.perm_facility||0), perm_settings:Number(r.perm_settings||0)
  }));
  console.log('[saveRoles] payload:', JSON.stringify(payload, null, 2));
  _saving = true;
  try{
    const res=await fetch('/api/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    console.log('[saveRoles] response:', res.status, data);
    if(!res.ok){alert(data.error||`保存に失敗しました（${res.status}）`);return;}
    await loadRoles();
    toast('保存しました','ok');
    clearDirty();
  }catch(e){
    console.error('[saveRoles] error:', e);
    alert('通信エラーが発生しました: '+e.message);
  } finally {
    _saving = false;
  }
}

async function getFacilityCode(){
  const saved=localStorage.getItem('careshift_facility');if(saved)return saved;
  const facs=await fetch('/api/facilities').then(r=>r.json()).catch(()=>[]);return facs[0]?.code||'';
}
async function openShift(step){const code=await getFacilityCode();location.href=code?`/shift?facility=${encodeURIComponent(code)}&step=${step}`:`/shift?step=${step}`;}
async function logoutApp(){await fetch('/api/auth/logout',{method:'POST'}).catch(()=>{});location.href='/login';}

function toggleLeftPanel(){
  const panel = document.querySelector('.side');
  const overlay = document.getElementById('left-overlay');
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}
function closeLeftPanel(){
  document.querySelector('.side').classList.remove('open');
  document.getElementById('left-overlay').classList.remove('open');
}

// ログイン中ユーザーをヘッダーに表示
(async()=>{
  try{
    const me = await fetch('/api/auth/me').then(r=>r.json()).catch(()=>null);
    if(me && me.ok){
      const badge = document.getElementById('nav-user-badge');
      const icon  = document.getElementById('nav-user-icon');
      const name  = document.getElementById('nav-user-name');
      if(badge) badge.style.display='flex';
      if(icon)  icon.textContent = (me.user.name||'?').charAt(0);
      if(name)  name.textContent = me.user.name || me.user.id;
    }
  }catch(e){}
})();

loadRoles();
</script>
</body></html>
