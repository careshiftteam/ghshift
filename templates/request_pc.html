<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHShift｜希望日入力</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f1f5f9;font-family:'Noto Sans JP','Yu Gothic UI',sans-serif;color:#111827}

/* ── ヘッダー ── */
.app-header{
  position:sticky;top:0;z-index:100;
  background:#2563eb;color:#fff;
  padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(15,23,42,.2);
}
.app-header h1{font-size:18px;font-weight:700}
.app-header .user-name{font-size:12px;opacity:.85;margin-top:2px}
.header-actions{display:flex;align-items:center;gap:10px}
.header-btn{
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
  color:#fff;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
}
.header-btn:hover{background:rgba(255,255,255,.32)}
.header-btn.primary{background:#fff;color:#2563eb;border-color:#fff;font-weight:700}
.header-btn.primary:hover{background:#eff6ff}

/* ── メインレイアウト ── */
.main-wrap{
  max-width:1000px;margin:0 auto;padding:20px 24px 40px;
  display:flex;flex-direction:column;gap:16px;
}
.toolbar{
  background:#fff;border:1px solid #e2e8f0;border-radius:10px;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.month-nav{display:flex;align-items:center;gap:12px}
.month-nav button{
  width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;
  background:#f8fafc;color:#475569;font-size:18px;cursor:pointer;
}
.month-nav button:hover{background:#eef2f7}
.month-title{font-size:17px;font-weight:700;color:#172033;min-width:120px;text-align:center}
.summary{display:flex;gap:18px;font-size:13px;color:#475569}
.summary .sm-rest{color:#64748b;font-weight:700}
.summary .sm-hol{color:#d97706;font-weight:700}
.hint-bar{font-size:12px;color:#64748b;padding:0 2px}

/* ── 2カラム：カレンダー＋一覧 ── */
.content-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.cal-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:#64748b;padding:2px 0 6px}
.cal-dow.sun{color:#ef4444}
.cal-dow.sat{color:#3b82f6}
.cal-day{
  position:relative;border:1px solid #f1f5f9;border-radius:8px;cursor:pointer;
  min-height:64px;padding:6px;display:flex;flex-direction:column;
}
.cal-day:hover{border-color:#c7d0dc;background:#f8fafc}
.cal-day.other-month{visibility:hidden;pointer-events:none}
.cal-day.today{border-color:#93c5fd}
.day-num{font-size:13px;font-weight:600;color:#172033}
.cal-day.sun .day-num{color:#ef4444}
.cal-day.sat .day-num{color:#3b82f6}
.cal-day.today .day-num{color:#2563eb}
.day-mark{
  margin-top:auto;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;
  align-self:flex-start;
}
.day-mark.rest{background:#f1f5f9;color:#64748b}
.day-mark.hol{background:#fffbeb;color:#d97706}

/* ── 右：登録一覧 ── */
.list-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;position:sticky;top:88px}
.list-title{font-size:13px;font-weight:700;color:#172033;margin-bottom:10px}
.req-item{
  display:flex;align-items:center;justify-content:space-between;
  border:1px solid #e2e8f0;border-radius:8px;
  padding:8px 10px;margin-bottom:6px;font-size:12px;
}
.req-item .rd-date{font-weight:700}
.req-item .rd-type{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700}
.rd-type.rest{background:#f1f5f9;color:#64748b}
.rd-type.hol{background:#fffbeb;color:#d97706}
.req-item .rd-del{background:none;border:none;color:#2563eb;font-size:11px;cursor:pointer;padding:2px 4px}
.no-req{text-align:center;color:#94a3b8;font-size:12px;padding:20px 0}

/* ── モーダル ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:200;
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal-box{width:320px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.25)}
.modal-title{font-size:14px;font-weight:700;margin-bottom:14px;color:#172033}
.modal-btn{
  width:100%;text-align:left;padding:12px 14px;border:1px solid #e2e8f0;border-radius:8px;
  background:#fff;font-size:13px;font-weight:600;margin-bottom:8px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:10px;
}
.modal-btn:hover{background:#f8fafc}
.modal-btn .dot-ic{width:10px;height:10px;border-radius:50%}
.modal-btn.rest .dot-ic{background:#94a3b8}
.modal-btn.hol .dot-ic{background:#d97706}
.modal-btn.clear{color:#ef4444;border-color:#fecaca}
.modal-cancel{
  width:100%;text-align:center;padding:10px;border:none;background:#f1f5f9;border-radius:8px;
  font-size:12px;color:#475569;margin-top:4px;cursor:pointer;font-family:inherit;
}

.loading{text-align:center;padding:50px 20px;color:#64748b;font-size:13px}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <h1>GHShift <span style="font-size:13px;font-weight:600;opacity:.9">｜希望日入力</span></h1>
    <div class="user-name" id="user-name">読み込み中...</div>
  </div>
  <div class="header-actions">
    <a class="header-btn primary" href="/view_shift">📅 シフト表へ</a>
    <button class="header-btn" onclick="doLogout()">ログアウト</button>
  </div>
</div>

<div class="main-wrap">
  <div class="toolbar">
    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <div class="month-title" id="month-title"></div>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="summary">
      <span>希望休 <span class="sm-rest" id="sm-rest">0</span>日</span>
      <span>有給 <span class="sm-hol" id="sm-hol">0</span>日</span>
    </div>
  </div>
  <div class="hint-bar">日付をクリックして「希望休」「有給」を登録できます。自分の希望のみ入力できます。</div>

  <div class="content-grid">
    <div class="cal-card">
      <div class="cal-grid" id="cal-grid"><div class="loading">読み込み中...</div></div>
    </div>
    <div class="list-card">
      <div class="list-title">今月の登録一覧</div>
      <div id="req-list"><div class="loading">読み込み中...</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">日付</div>
    <button class="modal-btn rest" onclick="setReq('rest')"><span class="dot-ic"></span>希望休にする</button>
    <button class="modal-btn hol" onclick="setReq('hol')"><span class="dot-ic"></span>有給にする</button>
    <button class="modal-btn clear" onclick="setReq(null)">登録を取り消す</button>
    <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<script>
const today = new Date();
let curYear = today.getFullYear();
let curMonth = today.getMonth() + 1;
let ME = null;
let REQS = {}; // day -> {req_type, priority, note}
let modalDay = null;
const WD = ['日','月','火','水','木','金','土'];
const TYPE_LABEL = {rest:'希望休', hol:'有給'};

async function init(){
  try{
    const me = await fetch('/api/auth/me').then(r=>r.json());
    if(!me.ok){ location.href='/login'; return; }
    ME = me.user;
    document.getElementById('user-name').textContent = ME.name || ME.login_id;

    await loadRequests();
    renderCalendar();
    renderList();
  }catch(e){
    document.getElementById('req-list').innerHTML = '<div class="loading">読み込みに失敗しました</div>';
  }
}

async function loadRequests(){
  REQS = {};
  const rows = await fetch(`/api/requests/${curYear}/${curMonth}`).then(r=>r.json()).catch(()=>[]);
  (Array.isArray(rows)?rows:[]).forEach(r=>{
    if(r.req_type==='rest' || r.req_type==='hol'){
      REQS[r.day] = r;
    }
  });
}

function renderCalendar(){
  document.getElementById('month-title').textContent = `${curYear}年${curMonth}月`;
  const grid = document.getElementById('cal-grid');
  let html = WD.map((w,i)=>
    `<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`
  ).join('');

  const firstDay = new Date(curYear, curMonth-1, 1).getDay();
  const lastDay = new Date(curYear, curMonth, 0).getDate();

  for(let i=0; i<firstDay; i++){
    html += `<div class="cal-day other-month"><div class="day-num">-</div></div>`;
  }

  let restCount=0, holCount=0;
  for(let d=1; d<=lastDay; d++){
    const date = new Date(curYear, curMonth-1, d);
    const dow = date.getDay();
    const isToday = curYear===today.getFullYear() && curMonth===today.getMonth()+1 && d===today.getDate();
    const isSun = dow===0, isSat = dow===6;
    const req = REQS[d];
    let markHtml = '';
    if(req){
      if(req.req_type==='rest'){ markHtml = `<div class="day-mark rest">希望休</div>`; restCount++; }
      else if(req.req_type==='hol'){ markHtml = `<div class="day-mark hol">有給</div>`; holCount++; }
    }
    html += `<div class="cal-day ${isToday?'today':''} ${isSun?'sun':''} ${isSat?'sat':''}"
      onclick="openModal(${d})">
      <div class="day-num">${d}</div>
      ${markHtml}
    </div>`;
  }

  const total = firstDay + lastDay;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for(let i=0; i<remaining; i++){
    html += `<div class="cal-day other-month"><div class="day-num">-</div></div>`;
  }

  grid.innerHTML = html;
  document.getElementById('sm-rest').textContent = restCount;
  document.getElementById('sm-hol').textContent = holCount;
}

function renderList(){
  const wrap = document.getElementById('req-list');
  const days = Object.keys(REQS).map(Number).sort((a,b)=>a-b);
  if(!days.length){
    wrap.innerHTML = '<div class="no-req">登録はまだありません</div>';
    return;
  }
  wrap.innerHTML = days.map(d=>{
    const req = REQS[d];
    const date = new Date(curYear, curMonth-1, d);
    return `<div class="req-item">
      <span class="rd-date">${curMonth}/${d}（${WD[date.getDay()]}）</span>
      <span class="rd-type ${req.req_type}">${TYPE_LABEL[req.req_type]}</span>
      <button class="rd-del" onclick="openModal(${d})">変更</button>
    </div>`;
  }).join('');
}

function openModal(d){
  modalDay = d;
  const date = new Date(curYear, curMonth-1, d);
  document.getElementById('modal-title').textContent = `${curMonth}月${d}日（${WD[date.getDay()]}）`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  modalDay = null;
}

async function setReq(type){
  if(!modalDay) return;
  const d = modalDay;
  closeModal();
  try{
    if(type===null){
      await fetch(`/api/requests/${ME.id}/${curYear}/${curMonth}/${d}`, {method:'DELETE'});
    }else{
      await fetch('/api/requests', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({staff_id: ME.id, year: curYear, month: curMonth, day: d, req_type: type, priority: 'prefer'})
      });
    }
    await loadRequests();
    renderCalendar();
    renderList();
  }catch(e){
    alert('保存に失敗しました。通信環境をご確認のうえ、もう一度お試しください。');
  }
}

async function prevMonth(){
  curMonth--;
  if(curMonth < 1){ curMonth=12; curYear--; }
  await loadRequests();
  renderCalendar();
  renderList();
}

async function nextMonth(){
  curMonth++;
  if(curMonth > 12){ curMonth=1; curYear++; }
  await loadRequests();
  renderCalendar();
  renderList();
}

async function doLogout(){
  await fetch('/api/auth/logout',{method:'POST'}).catch(()=>{});
  location.href='/login';
}

init();
</script>
</body>
</html>
