<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHShift｜シフト確認</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f1f5f9;font-family:'Noto Sans JP','Yu Gothic UI',sans-serif;color:#111827}

/* ── ヘッダー ── */
.app-header{
  position:sticky;top:0;z-index:100;
  background:#2563eb;color:#fff;
  padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(15,23,42,.2);
}
.app-header h1{font-size:18px;font-weight:700}
.app-header .page-title{font-size:12px;font-weight:600;opacity:.85;margin-top:1px}
.app-header .user-name{font-size:12px;opacity:.85;margin-top:2px}
.header-actions{display:flex;align-items:center;gap:10px}
.header-btn{
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
  color:#fff;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
}
.header-btn:hover{background:rgba(255,255,255,.32)}
.header-btn.primary{background:#fff;color:#2563eb;border-color:#fff;font-weight:700}
.header-btn.primary:hover{background:#eff6ff}

/* ── メインレイアウト：左カレンダー／右詳細 ── */
.main-wrap{
  max-width:1080px;margin:0 auto;padding:20px 24px 40px;
  display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start;
}

/* ── カレンダー部分 ── */
.cal-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;position:sticky;top:88px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav button{
  width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;
  background:#f8fafc;color:#475569;font-size:18px;cursor:pointer;
}
.cal-nav button:hover{background:#eef2f7}
.cal-nav .cal-title{font-size:16px;font-weight:700;color:#172033}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:#64748b;padding:2px 0 6px}
.cal-dow.sun{color:#ef4444}
.cal-dow.sat{color:#3b82f6}
.cal-day{
  position:relative;display:flex;flex-direction:column;align-items:center;
  padding:6px 2px 8px;border-radius:8px;cursor:pointer;min-height:52px;
}
.cal-day:hover{background:#f8fafc}
.cal-day.other-month{visibility:hidden;pointer-events:none}
.cal-day.today .day-num{
  background:#2563eb;color:#fff;border-radius:50%;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
}
.cal-day.selected{background:#eff6ff}
.cal-day.selected .day-num{color:#2563eb;font-weight:700}
.day-num{font-size:13px;font-weight:500;color:#172033;line-height:26px}
.cal-day.sun .day-num{color:#ef4444}
.cal-day.sat .day-num{color:#3b82f6}
.cal-day.today .day-num{color:#fff!important}
.shift-dot{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px;min-height:6px}
.dot{width:5px;height:5px;border-radius:50%}
.dot-早{background:#16a34a}
.dot-遅{background:#d97706}
.dot-夜{background:#7c3aed}
.dot-明{background:#7c3aed;opacity:.5}
.dot-日{background:#0891b2}
.dot-休{background:#cbd5e1}

/* ── 右：シフト詳細 ── */
.detail-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;min-height:400px}
.detail-date{
  font-size:16px;font-weight:700;color:#172033;
  margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e2e8f0;
}
.no-shift,.unpublished{text-align:center;color:#94a3b8;font-size:13px;padding:60px 0}

.unit-card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;margin-bottom:12px;overflow:hidden}
.unit-card-header{background:#f8fafc;padding:8px 14px;font-size:12px;font-weight:700;color:#475569;border-bottom:1px solid #e2e8f0}
.shift-row{display:grid;grid-template-columns:36px 1fr;border-bottom:1px solid #f1f5f9}
.shift-row:last-child{border-bottom:none}
.shift-badge{display:flex;align-items:center;justify-content:center;padding:10px 4px;font-size:13px;font-weight:700;border-right:1px solid #f1f5f9}
.shift-badge.早{color:#16a34a;background:#f0fdf4}
.shift-badge.遅{color:#d97706;background:#fffbeb}
.shift-badge.夜{color:#7c3aed;background:#faf5ff}
.shift-badge.明{color:#7c3aed;background:#faf5ff;opacity:.7}
.shift-badge.日{color:#0891b2;background:#f0f9ff}
.shift-badge.休{color:#94a3b8;background:#f8fafc}
.staff-names{padding:10px 12px;font-size:13px;color:#172033;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.staff-chip{background:#f1f5f9;border-radius:5px;padding:3px 8px;font-size:12px;color:#334155}
.staff-chip.me{background:#dbeafe;color:#1d4ed8;font-weight:700}

.loading{text-align:center;padding:60px 20px;color:#64748b;font-size:13px}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <h1>GHShift <span class="page-title" style="font-size:13px;font-weight:600;opacity:.9">｜シフト確認</span></h1>
    <div class="user-name" id="user-name">読み込み中...</div>
  </div>
  <div class="header-actions">
    <a class="header-btn primary" href="/request">📝 希望日入力へ</a>
    <button class="header-btn" onclick="doLogout()">ログアウト</button>
  </div>
</div>

<div class="main-wrap">
  <div class="cal-card">
    <div class="cal-nav">
      <button onclick="prevMonth()">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="detail-card" id="detail-card">
    <div class="loading">読み込み中...</div>
  </div>
</div>

<script>
const today = new Date();
let curYear = today.getFullYear();
let curMonth = today.getMonth() + 1;
let selectedDay = today.getDate();
let ME = null;
let FAC = null;
let SHIFTS = {}; // day -> [{unit_name, shift_type, staff_id, staff_name}]
const WD = ['日','月','火','水','木','金','土'];
const SHIFT_ORDER = ['早','遅','夜','明','日','休'];

async function init(){
  try{
    const me = await fetch('/api/auth/me').then(r=>r.json());
    if(!me.ok){ location.href='/login'; return; }
    ME = me.user;
    document.getElementById('user-name').textContent = ME.name || ME.login_id;

    const facs = await fetch('/api/facilities').then(r=>r.json());
    FAC = facs.find(f=>f.code === ME.fac_code) || facs[0];

    await loadShifts();
    renderCalendar();
    renderDetail(selectedDay);
  }catch(e){
    document.getElementById('detail-card').innerHTML =
      '<div class="loading">読み込みに失敗しました</div>';
  }
}

async function loadShifts(){
  SHIFTS = {};
  if(!FAC) return;

  const versions = await fetch(
    `/api/shifts/versions/${curYear}/${curMonth}?facility=${FAC.code}`
  ).then(r=>r.json()).catch(()=>[]);

  const published = Array.isArray(versions)
    ? versions.filter(v=>v.status==='published')
    : [];
  if(!published.length) return;

  const vid = published.sort((a,b)=>b.version_no-a.version_no)[0].id;

  const entries = await fetch(
    `/api/shifts/${curYear}/${curMonth}?facility=${FAC.code}&vid=${vid}`
  ).then(r=>r.json()).catch(()=>[]);

  const staffList = await fetch('/api/staff?all=1').then(r=>r.json()).catch(()=>[]);
  const staffMap = {};
  staffList.forEach(s=>{ staffMap[s.id]=s; });

  const unitMap = {};
  (FAC.units||[]).forEach(u=>{ unitMap[u.id]=u.name; });

  entries.forEach(e=>{
    const day = parseInt(e.date.split('-')[2]);
    if(!SHIFTS[day]) SHIFTS[day] = [];
    const s = staffMap[e.staff_id];
    if(!s) return;
    SHIFTS[day].push({
      unit_id: e.unit_id,
      unit_name: unitMap[e.unit_id] || '',
      shift_type: e.shift_type,
      staff_id: e.staff_id,
      staff_name: s.name,
    });
  });
}

function renderCalendar(){
  document.getElementById('cal-title').textContent = `${curYear}年${curMonth}月`;
  const grid = document.getElementById('cal-grid');
  let html = WD.map((w,i)=>
    `<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`
  ).join('');

  const firstDay = new Date(curYear, curMonth-1, 1).getDay();
  const lastDay = new Date(curYear, curMonth, 0).getDate();

  for(let i=0; i<firstDay; i++){
    html += `<div class="cal-day other-month"><div class="day-num">-</div></div>`;
  }

  for(let d=1; d<=lastDay; d++){
    const date = new Date(curYear, curMonth-1, d);
    const dow = date.getDay();
    const isToday = curYear===today.getFullYear() && curMonth===today.getMonth()+1 && d===today.getDate();
    const isSel = d === selectedDay;
    const isSun = dow === 0;
    const isSat = dow === 6;
    const dayShifts = SHIFTS[d] || [];

    const types = [...new Set(dayShifts.map(s=>s.shift_type))];
    const dots = types.slice(0,4).map(t=>
      `<div class="dot dot-${t}"></div>`
    ).join('');

    html += `<div class="cal-day ${isToday?'today':''} ${isSel?'selected':''} ${isSun?'sun':''} ${isSat?'sat':''}"
      onclick="selectDay(${d})">
      <div class="day-num">${d}</div>
      <div class="shift-dot">${dots}</div>
    </div>`;
  }

  const total = firstDay + lastDay;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for(let i=0; i<remaining; i++){
    html += `<div class="cal-day other-month"><div class="day-num">-</div></div>`;
  }

  grid.innerHTML = html;
}

function selectDay(d){
  selectedDay = d;
  renderCalendar();
  renderDetail(d);
}

function renderDetail(d){
  const card = document.getElementById('detail-card');
  const date = new Date(curYear, curMonth-1, d);
  const dow = WD[date.getDay()];
  const isSun = date.getDay()===0;
  const isSat = date.getDay()===6;
  const dowColor = isSun?'color:#ef4444':isSat?'color:#3b82f6':'';

  const dayShifts = SHIFTS[d] || [];

  if(!Object.keys(SHIFTS).length){
    card.innerHTML = `
      <div class="detail-date">${curMonth}月${d}日（<span style="${dowColor}">${dow}</span>）</div>
      <div class="unpublished">📋 この月の公開済みシフトがありません</div>`;
    return;
  }

  if(!dayShifts.length){
    card.innerHTML = `
      <div class="detail-date">${curMonth}月${d}日（<span style="${dowColor}">${dow}</span>）</div>
      <div class="no-shift">この日のシフトはありません</div>`;
    return;
  }

  const unitGroups = {};
  dayShifts.forEach(e=>{
    const key = e.unit_id;
    if(!unitGroups[key]) unitGroups[key] = {name: e.unit_name, shifts: {}};
    if(!unitGroups[key].shifts[e.shift_type]) unitGroups[key].shifts[e.shift_type] = [];
    unitGroups[key].shifts[e.shift_type].push({id:e.staff_id, name:e.staff_name});
  });

  let html = `<div class="detail-date">${curMonth}月${d}日（<span style="${dowColor}">${dow}</span>）</div>`;

  Object.values(unitGroups).forEach(unit=>{
    html += `<div class="unit-card">
      <div class="unit-card-header">${unit.name}</div>`;

    SHIFT_ORDER.forEach(type=>{
      const staffs = unit.shifts[type];
      if(!staffs || !staffs.length) return;
      const chips = staffs.map(s=>
        `<span class="staff-chip ${s.id===ME?.id?'me':''}">${s.name}</span>`
      ).join('');
      html += `<div class="shift-row">
        <div class="shift-badge ${type}">${type}</div>
        <div class="staff-names">${chips}</div>
      </div>`;
    });

    html += `</div>`;
  });

  card.innerHTML = html;
}

async function prevMonth(){
  curMonth--;
  if(curMonth < 1){ curMonth=12; curYear--; }
  selectedDay = 1;
  await loadShifts();
  renderCalendar();
  renderDetail(selectedDay);
}

async function nextMonth(){
  curMonth++;
  if(curMonth > 12){ curMonth=1; curYear++; }
  selectedDay = 1;
  await loadShifts();
  renderCalendar();
  renderDetail(selectedDay);
}

async function doLogout(){
  await fetch('/api/auth/logout',{method:'POST'}).catch(()=>{});
  location.href='/login';
}

init();
</script>
</body>
</html>
